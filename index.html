  <style>
    @media print {

      .no-print { display: none !important; }

      tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      .table-container { max-height: none !important; overflow: visible !important; border: none !important; }
    }

    .table-container {
      max-height: calc(100vh - 270px);
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
    }

    /* 關鍵修復：表頭固定且必須擁有完全不透明實心背景色，防止下方滑動內文重疊透出 */
    .sticky-header th {
      position: sticky !important;
      top: 0 !important;
      z-index: 25 !important;
      background-color: #f1f5f9 !important; /* 實心 slate-100，絕不透明 */
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);

    /* 總表 隊別專屬底色 */

    .bg-team-green { background-color: #ecfdf5; }
    .bg-team-successor { background-color: #fef9c3; }

    /* 活動流程 階層縮排樣式 */
    .bullet-level-1 {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-1::before {
      content: "•";
      position: absolute;
      left: 0.15rem;
      top: -0.05rem;
      font-weight: bold;
      color: #64748b;
    }

    .bullet-level-2 {
      position: relative;
      padding-left: 1.75rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-2::before {
      content: "◦";
      position: absolute;
      left: 0.85rem;
      top: -0.05rem;
      font-weight: bold;
      color: #94a3b8;
    }

    .bullet-level-3 {
      position: relative;
      padding-left: 2.5rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-3::before {
      content: "▪";
      position: absolute;
      left: 1.65rem;
      top: 0rem;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    /* 需行政支援 紫色標記卡片 */

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- 主要操作區 -->

    window.addEventListener('DOMContentLoaded', () => {

    function updateTimestampDisplay() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('updateTimestamp').textContent = `${yy}'${mm}${dd}-${hh}${min}`;
    }

    /* 手動貼上匯入機制 */
    function toggleImportPanel() {
      const panel = document.getElementById('importPanel');
      panel.classList.toggle('hidden');
    }

    function processPastedData() {
      const text = document.getElementById('importTextarea').value.trim();
      if (!text) {
        alert('請先貼上試算表文字！');
        return;
      }

      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          if (!results.data || results.data.length === 0) {
            alert('無法解析貼上的資料，請確認是否包含表頭欄位！');
            return;
          }

          const parsedRows = results.data.map(r => {
            const getVal = (possibleKeys) => {
              for (const k of possibleKeys) {
                if (r[k] !== undefined) return String(r[k]).trim();
              }
              return '';
            };

            return {
              team: getVal(['隊別', '組別']),
              name: getVal(['姓名', '名字']),
              trafficOut: getVal(['交通-去程', '去程交通', '交通去程']),
              trafficBack: getVal(['交通-回程', '回程交通', '交通回程']),
              isTrafficLeader: getVal(['交通-去程_隊長', '交通_隊長', '隊長']) === '隊長' ? '是' : '否',
              restaurant: getVal(['餐廳', '用餐餐廳']),
              isDiningLeader: getVal(['餐廳_隊長', '用餐_隊長']) === '隊長' ? '是' : '否',
              diet: getVal(['飲食注意事項', '飲食', '飲食備註']) || '無',
              hotel: getVal(['住宿', '住宿飯店', '飯店']),
              roomType: getVal(['房型', '房間類型']),
              roomGroup: getVal(['房間分組', '住宿-房型-分組', '房型分組', '分組']),
              roommates: getVal(['室友'])
            };
          }).filter(i => i.name);

          if (parsedRows.length > 0) {
            rawDirectoryData = parsedRows;
            calculateDirectoryRoommates();
            renderCurrentTab();
            toggleImportPanel();
            alert(`成功載入 ${parsedRows.length} 筆真實名冊資料！`);
          } else {
            alert('未能在資料中找到姓名欄位，請檢查欄位名稱！');
          }
        }
      });
    }

    /* 雲端自動讀取 */
    async function fetchCloudDataSilently() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(`${GOOGLE_SHEET_DIR_URL}&_t=${Date.now()}`, {
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const csvText = await res.text();
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
              if (results.data && results.data.length > 0) {
                // 自動更新
                rawDirectoryData = results.data.map(r => ({
                  team: r['隊別'] || '',
                  name: r['姓名'] || '',
                  trafficOut: r['交通-去程'] || '',
                  trafficBack: r['交通-回程'] || '',
                  isTrafficLeader: (r['交通-去程_隊長'] === '隊長') ? '是' : '否',
                  restaurant: r['餐廳'] || '',
                  isDiningLeader: (r['餐廳_隊長'] === '隊長') ? '是' : '否',
                  diet: r['飲食注意事項'] || '無',
                  hotel: r['住宿'] || '',
                  roomType: r['房型'] || '',
                  roomGroup: r['住宿-房型-分組'] || r['房間分組'] || '',
                  roommates: r['室友'] || ''
                })).filter(i => i.name);
                calculateDirectoryRoommates();
              }
            }
          });
        }
      } catch (err) {
        console.warn('雲端資料直連受限，維持當前名冊狀態。');
      } finally {
        refreshIcon.classList.remove('fa-spin');
        renderCurrentTab();
      }
    }

    function manualRefreshData() {
      updateTimestampDisplay();
      fetchCloudDataSilently();
    }

    /* =========================================================
       3. 室友關聯計算
       ========================================================= */
    function calculateDirectoryRoommates() {
      const roomMap = {};
      rawDirectoryData.forEach(item => {
        if (!item.roomGroup || item.roomGroup === 'NONE') return;
        const key = `${item.hotel}-${item.roomType}-${item.roomGroup}`;
        if (!roomMap[key]) roomMap[key] = [];
        roomMap[key].push(item.name);
      });

      rawDirectoryData.forEach(item => {
        if (item.name === '林政緯' || item.name === '林珊汝') {
          item.roommates = '家人';
          return;
        }
        if (item.name === '杜志峰') {
          item.roommates = '無';
          return;
        }

        if (!item.roomGroup || item.roomGroup === 'NONE') {
          if (!item.roommates) item.roommates = '無';
          return;
        }

        const key = `${item.hotel}-${item.roomType}-${item.roomGroup}`;
        const mates = (roomMap[key] || []).filter(n => n !== item.name);
        item.roommates = mates.length > 0 ? mates.join(', ') : (item.roommates || '無');
      });
    }

    function getScheduleRowBg(date, startTime) {
      const is1031 = String(date).includes('31');
      let hour = 0;
      if (startTime) {
        const parts = startTime.split(':');
        hour = parseInt(parts[0], 10) || 0;
      }
      const isBeforeNoon = hour < 12;

      if (is1031) {
        return isBeforeNoon ? 'bg-blue-50/70 hover:bg-blue-50' : 'bg-purple-50/70 hover:bg-purple-50';
      } else {
        return isBeforeNoon ? 'bg-emerald-50/70 hover:bg-emerald-50' : 'bg-amber-50/70 hover:bg-amber-50';
      }
    }

    function formatScheduleNote(text) {
      if (!text) return '<span class="text-slate-300">-</span>';
      const lines = text.split('\n');
      
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '';

        const hasAdminSupport = trimmed.includes('需行政支援');
        let renderedText = escapeHtml(trimmed);

        let levelClass = '';
        if (trimmed.startsWith('---')) {
          levelClass = 'bullet-level-3';
          renderedText = escapeHtml(trimmed.replace(/^---+/, '').trim());
        } else if (trimmed.startsWith('--')) {
          levelClass = 'bullet-level-2';
          renderedText = escapeHtml(trimmed.replace(/^--+/, '').trim());
        } else if (trimmed.startsWith('-')) {
          levelClass = 'bullet-level-1';
          renderedText = escapeHtml(trimmed.replace(/^-+/, '').trim());
        }

        if (hasAdminSupport) {
          return `<div class="${levelClass} admin-support-item"><i class="fa-solid fa-bell mr-1 text-purple-600"></i>${renderedText}</div>`;
        }

        return `<div class="${levelClass}">${renderedText}</div>`;
      }).join('');
    }

            <td class="py-3 px-3 text-center text-slate-400">${idx + 1}</td>
            <td class="py-3 px-3">
              <div class="font-bold text-slate-900">${escapeHtml(item.name)}</div>
              ${leaderBadge}
            </td>
            <td class="py-3 px-3 font-semibold text-slate-800">${escapeHtml(item.trafficOut)}</td>
            <td class="py-3 px-3 font-semibold text-slate-800">${escapeHtml(item.trafficBack)}</td>
          </tr>
        `;
      }).join('');
    }

    function getTrafficBackBgClass(trafficBack) {
      if (trafficBack === '遊覽車') return 'bg-teal-50/70 hover:bg-teal-50';
      if (trafficBack === '開車') return 'bg-amber-50/70 hover:bg-amber-50';
      if (trafficBack === '高鐵') return 'bg-sky-50/70 hover:bg-sky-50';
      if (trafficBack === '自處') return 'bg-slate-100/60 hover:bg-slate-100';
      return 'bg-white hover:bg-slate-50';
    }

    function getTrafficLeaderBadge(item) {
      if (item.isTrafficLeader === '是') {
        return `<div class="text-[11px] font-semibold text-rose-600 mt-0.5">（遊覽車 隊長）</div>`;
      }
      return '';
    }

    /* --- [分頁4] 餐飲安排 --- */
    function renderDiningTab(thead, tbody, countBadge) {
      thead.innerHTML = `
        <tr class="text-sm">
          <th class="py-3 px-3 text-center w-10 text-slate-400">#</th>
          ${renderHeaderTh('用餐餐廳', 'restaurant', 'w-36')}
          ${renderHeaderTh('姓名', 'name', 'w-36')}
          ${renderHeaderTh('飲食注意事項', 'diet', 'w-44')}
          ${renderHeaderTh('交通方式', 'trafficOut', 'w-36')}
        </tr>
      `;

      let list = getProcessedDirectoryList().filter(i => i.restaurant !== 'NO' && i.restaurant !== '無');
      countBadge.textContent = `共 ${list.length} 位用餐人員`;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-slate-400 text-sm">無符合的餐飲資料</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((item, idx) => {
        const bgClass = getRestaurantBgClass(item.restaurant);
        const icon = getRestaurantIcon(item.restaurant);
        
        let trafficMethod = item.trafficOut;
        if (trafficMethod === '自處') trafficMethod = '遊覽車';

        const isDietNone = !item.diet || item.diet === '無';
        const dietDisplay = isDietNone 
          ? `<span class="text-slate-400">無</span>`
          : `<span class="font-semibold text-rose-700 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">${escapeHtml(item.diet)}</span>`;

        const leaderBadge = item.isDiningLeader === '是'
          ? `<div class="text-[11px] font-semibold text-rose-600 mt-0.5">（遊覽車 隊長）</div>`
          : '';

        return `
          <tr class="text-sm border-b border-slate-200 transition-colors ${bgClass}">
            <td class="py-3 px-3 text-center text-slate-400">${idx + 1}</td>
            <td class="py-3 px-3 font-bold text-slate-800 flex items-center space-x-1.5">
              ${icon}
              <span>${escapeHtml(item.restaurant)}</span>
            </td>
            <td class="py-3 px-3">
              <div class="font-bold text-slate-900">${escapeHtml(item.name)}</div>
              ${leaderBadge}
            </td>
            <td class="py-3 px-3">${dietDisplay}</td>
            <td class="py-3 px-3 font-medium text-slate-700">${escapeHtml(trafficMethod)}</td>
          </tr>
        `;
      }).join('');
    }

    function getRestaurantBgClass(rest) {
      if (rest.includes('麵五三')) return 'bg-amber-50/60 hover:bg-amber-50';
      if (rest.includes('植田')) return 'bg-emerald-50/60 hover:bg-emerald-50';
      if (rest.includes('弎食')) return 'bg-rose-50/60 hover:bg-rose-50';
      if (rest.includes('湫禾')) return 'bg-indigo-50/60 hover:bg-indigo-50';
      return 'bg-white hover:bg-slate-50';
    }

    function getRestaurantIcon(rest) {
      if (rest.includes('麵五三')) return '<i class="fa-solid fa-bowl-food text-amber-600"></i>';
      if (rest.includes('植田')) return '<i class="fa-solid fa-fish text-emerald-600"></i>';
      if (rest.includes('弎食')) return '<i class="fa-solid fa-fire-burner text-rose-600"></i>';
      if (rest.includes('湫禾')) return '<i class="fa-solid fa-plate-wheat text-indigo-600"></i>';
      return '<i class="fa-solid fa-utensils text-slate-500"></i>';
    }

    /* --- [分頁5] 住宿安排 --- */
    function renderLodgingTab(thead, tbody, countBadge) {
      thead.innerHTML = `
        <tr class="text-sm">
          <th class="py-3 px-3 text-center w-10 text-slate-400">#</th>
          ${renderHeaderTh('住宿飯店', 'hotel', 'w-32')}
          ${renderHeaderTh('房型', 'roomType', 'w-28')}
          ${renderHeaderTh('姓名', 'name', 'w-32')}
          ${renderHeaderTh('同房室友', 'roommates', '')}
        </tr>
      `;

      let list = getProcessedDirectoryList().filter(i => i.name !== '彭偉峰');
      countBadge.textContent = `共 ${list.length} 位住宿人員`;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center text-slate-400 text-sm">無符合的住宿資料</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((item, idx) => {
        const bgClass = getLodgingComboBgClass(item.hotel, item.roomType);
        const hotelIcon = item.hotel.includes('正巧')
          ? '<i class="fa-solid fa-tree-city text-emerald-600 mr-1.5"></i>'
          : '<i class="fa-solid fa-landmark text-sky-600 mr-1.5"></i>';

        return `
          <tr class="text-sm border-b border-slate-200 transition-colors ${bgClass}">
            <td class="py-3 px-3 text-center text-slate-400">${idx + 1}</td>
            <td class="py-3 px-3 font-bold text-slate-800 flex items-center">
              ${hotelIcon}
              <span>${escapeHtml(item.hotel)}</span>
            </td>
            <td class="py-3 px-3 font-semibold text-slate-700">${escapeHtml(item.roomType)}</td>
            <td class="py-3 px-3 font-bold text-slate-900">${escapeHtml(item.name)}</td>
            <td class="py-3 px-3">${renderRoommateChips(item.roommates)}</td>
          </tr>
        `;
      }).join('');
    }

    function getLodgingComboBgClass(hotel, roomType) {
      const combo = `${hotel}-${roomType}`;
      if (combo.includes('正巧-4人')) return 'bg-emerald-50/60 hover:bg-emerald-50';
      if (combo.includes('正巧-2人')) return 'bg-teal-50/60 hover:bg-teal-50';
      if (combo.includes('知達-2人')) return 'bg-sky-50/60 hover:bg-sky-50';
      if (combo.includes('知達-單人')) return 'bg-indigo-50/60 hover:bg-indigo-50';
      return 'bg-white hover:bg-slate-50';
    }

    function renderRoommateChips(roommatesStr) {
      if (!roommatesStr || roommatesStr === '無') {
        return `<span class="text-slate-400 text-xs">無</span>`;
      }
      if (roommatesStr === '家人') {
        return `<span class="inline-block bg-purple-100 text-purple-800 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-purple-200">家人</span>`;
      }

      const names = roommatesStr.split(/[,、]/).map(n => n.trim()).filter(Boolean);
      return `
        <div class="flex flex-wrap gap-1.5">
          ${names.map(name => `
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold bg-emerald-100 text-emerald-800 border border-emerald-200">
              <i class="fa-solid fa-user mr-1 text-[10px] text-emerald-600"></i>
              ${escapeHtml(name)}
            </span>
          `).join('')}
        </div>
      `;
    }

    /* =========================================================
       6. 排序與表頭過濾邏輯
       ========================================================= */
    function renderHeaderTh(colTitle, colKey, widthClass) {
      const hasFilter = columnFilters[colKey] && columnFilters[colKey].size > 0;
      const isSorted = activeSortColumn === colKey;
      let sortIcon = 'fa-solid fa-arrow-down-up-across-line text-slate-300';
      if (isSorted) {
        sortIcon = activeSortDirection === 'asc' 
          ? 'fa-solid fa-arrow-up-short-wide text-emerald-600' 
          : 'fa-solid fa-arrow-down-wide-short text-emerald-600';
      }

      return `
        <th class="py-3 px-3 font-semibold ${widthClass}">
          <div class="flex items-center justify-between group">
            <span>${colTitle}</span>
            <button onclick="openFilterModal('${colKey}', '${colTitle}', event)" class="p-1 rounded hover:bg-slate-200 transition-colors">
              <i class="${sortIcon} ${hasFilter ? 'text-emerald-600' : ''}"></i>
            </button>
          </div>
        </th>
      `;
    }

    function getProcessedDirectoryList() {
      let list = [...rawDirectoryData];

      if (searchQuery) {
        list = list.filter(item => {
          const rowText = `${item.team} ${item.name} ${item.trafficOut} ${item.trafficBack} ${item.restaurant} ${item.diet} ${item.hotel} ${item.roomType} ${item.roommates}`.toLowerCase();
          return rowText.includes(searchQuery);
        });
      }

      Object.keys(columnFilters).forEach(colKey => {
        const allowedSet = columnFilters[colKey];
        if (allowedSet && allowedSet.size > 0) {
          list = list.filter(item => {
            const val = getColumnValue(item, colKey);
            return allowedSet.has(val);
          });
        }
      });

      const strokeSort = (a, b) => (a || '').localeCompare(b || '', 'zh-Hant-TW', { collation: 'stroke' });

      if (activeSortColumn && activeSortDirection) {
        list.sort((a, b) => {
          const valA = getColumnValue(a, activeSortColumn);
          const valB = getColumnValue(b, activeSortColumn);
          const res = strokeSort(valA, valB);
          return activeSortDirection === 'asc' ? res : -res;
        });
      } else {
        if (currentTab === 'overview') {
          const teamOrder = { '白': 1, '紅': 2, '綠': 3, '接班人': 4 };
          list.sort((a, b) => {
            const tA = teamOrder[a.team] || 99;
            const tB = teamOrder[b.team] || 99;
            if (tA !== tB) return tA - tB;
            if (a.restaurant !== b.restaurant) return strokeSort(a.restaurant, b.restaurant);
            const comboA = `${a.hotel}-${a.roomType}`;
            const comboB = `${b.hotel}-${b.roomType}`;
            if (comboA !== comboB) return strokeSort(comboA, comboB);
            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'traffic') {
          list.sort((a, b) => {
            if (a.isTrafficLeader === '是' && b.isTrafficLeader !== '是') return -1;
            if (a.isTrafficLeader !== '是' && b.isTrafficLeader === '是') return 1;
            const tRank = { '遊覽車': 1, '開車': 2, '自處': 3, '高鐵': 4 };
            const outA = tRank[a.trafficOut] || 99;
            const outB = tRank[b.trafficOut] || 99;
            if (outA !== outB) return outA - outB;
            const backA = tRank[a.trafficBack] || 99;
            const backB = tRank[b.trafficBack] || 99;
            if (backA !== backB) return backA - backB;
            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'dining') {
          list.sort((a, b) => {
            if (a.restaurant !== b.restaurant) return strokeSort(a.restaurant, b.restaurant);
            if (a.isDiningLeader === '是' && b.isDiningLeader !== '是') return -1;
            if (a.isDiningLeader !== '是' && b.isDiningLeader === '是') return 1;
            return strokeSort(a.name, b.name);
          });
        } else if (currentTab === 'lodging') {
          list.sort((a, b) => {
            if (a.hotel !== b.hotel) return strokeSort(a.hotel, b.hotel);
            if (a.roomType !== b.roomType) return strokeSort(a.roomType, b.roomType);
            return strokeSort(a.name, b.name);
          });
        }
      }

      return list;
    }

    function getColumnValue(item, colKey) {
      if (colKey === 'trafficCombo') return `${item.trafficOut}/${item.trafficBack}`;
      if (colKey === 'lodgingCombo') return `${item.hotel}-${item.roomType}`;
      return item[colKey] || '';
    }

    /* --- 篩選彈窗 --- */
    function openFilterModal(colKey, colTitle, event) {
      event.stopPropagation();
      activeFilterColumn = colKey;
      document.getElementById('modalColumnTitle').textContent = `${colTitle} 篩選`;

      const modal = document.getElementById('filterDropdownModal');
      const overlay = document.getElementById('filterModalOverlay');

      const rect = event.currentTarget.getBoundingClientRect();
      const modalW = 288;
      let leftPos = rect.left - 100;
      if (leftPos + modalW > window.innerWidth - 10) leftPos = window.innerWidth - modalW - 10;
      if (leftPos < 10) leftPos = 10;
      
      modal.style.top = `${Math.min(rect.bottom + 8, window.innerHeight - 360)}px`;
      modal.style.left = `${leftPos}px`;

      renderFilterCheckboxes('');
      document.getElementById('filterValueSearch').value = '';

      overlay.classList.remove('hidden');
      modal.classList.remove('hidden');
    }

    function closeFilterModal() {
      document.getElementById('filterDropdownModal').classList.add('hidden');
      document.getElementById('filterModalOverlay').classList.add('hidden');
    }

    function renderFilterCheckboxes(searchTerm) {
      if (!activeFilterColumn) return;
      const listContainer = document.getElementById('filterCheckboxList');
      
      const allVals = Array.from(new Set(rawDirectoryData.map(i => getColumnValue(i, activeFilterColumn)))).filter(Boolean);
      const currentSelected = columnFilters[activeFilterColumn] || new Set(allVals);

      const filteredVals = allVals.filter(v => !searchTerm || v.toLowerCase().includes(searchTerm.toLowerCase()));

      listContainer.innerHTML = filteredVals.map(val => {
        const isChecked = currentSelected.has(val);
        return `
          <label class="flex items-center space-x-2 py-1 px-1 rounded hover:bg-slate-100 cursor-pointer">
            <input type="checkbox" value="${escapeHtml(val)}" class="filter-chk accent-emerald-600 rounded" ${isChecked ? 'checked' : ''}>
            <span class="truncate">${escapeHtml(val)}</span>
          </label>
        `;
      }).join('');
    }

    function toggleSelectAllFilter() {
      const chks = document.querySelectorAll('.filter-chk');
      const allChecked = Array.from(chks).every(c => c.checked);
      chks.forEach(c => c.checked = !allChecked);
    }

    function confirmColumnFilter() {
      if (!activeFilterColumn) return;
      const chks = document.querySelectorAll('.filter-chk');
      const selected = new Set();
      chks.forEach(c => {
        if (c.checked) selected.add(c.value);
      });

      columnFilters[activeFilterColumn] = selected;
      closeFilterModal();
      renderCurrentTab();
    }

    function applySort(direction) {
      activeSortColumn = activeFilterColumn;
      activeSortDirection = direction;
      closeFilterModal();
      renderCurrentTab();
    }

    /* --- 活動流程編輯 --- */
    function handleScheduleEditToggle() {
      if (!isScheduleEditing) {
        requestPasswordAuth(() => {
          isScheduleEditing = true;
          document.getElementById('editBtnText').textContent = '完成並鎖定';
          document.getElementById('addScheduleRowBtn').classList.remove('hidden');
          renderCurrentTab();
        });
      } else {
        isScheduleEditing = false;
        document.getElementById('editBtnText').textContent = '編輯流程';
        document.getElementById('addScheduleRowBtn').classList.add('hidden');
        renderCurrentTab();
      }
    }

    function updateScheduleCell(id, field, value) {
      const target = scheduleData.find(item => item.id === id);
      if (target) {
        target[field] = value;
      }
    }

    function addScheduleRow() {
      const nextId = scheduleData.length > 0 ? Math.max(...scheduleData.map(i => i.id)) + 1 : 1;
      scheduleData.push({
        id: nextId,
        date: "10/31",
        startTime: "12:00",
        endTime: "13:00",
        duration: "60分",
        location: "新地點",
        activity: "新活動項目",
        note: "- 項目說明\n-- 備註事項"
      });
      renderCurrentTab();
    }

    function deleteScheduleRow(id) {
      if (confirm('確定要刪除此筆流程項目嗎？')) {
        scheduleData = scheduleData.filter(i => i.id !== id);
        renderCurrentTab();
      }
    }

    /* --- 密碼與 PDF 匯出 --- */
    function requestPasswordAuth(onSuccess) {
      pendingPasswordCallback = onSuccess;
      const modal = document.getElementById('passwordModal');
      const input = document.getElementById('passwordInput');
      input.value = '';
      modal.classList.remove('hidden');
      input.focus();

      document.getElementById('passwordConfirmBtn').onclick = () => {
        if (input.value === '1223') {
          closePasswordModal();
          if (pendingPasswordCallback) pendingPasswordCallback();
        } else {
          alert('密碼錯誤！請重新輸入。');
          input.value = '';
          input.focus();
        }
      };
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').classList.add('hidden');
      pendingPasswordCallback = null;
    }

    function promptExportPDF() {
      requestPasswordAuth(() => {
        executePDFExport();
      });
    }

    function executePDFExport() {
      const element = document.getElementById('printableContent');
      const opt = {
        margin: [8, 8, 8, 8],
        filename: `重啟人生-翻轉實驗室_${currentTab}_${document.getElementById('updateTimestamp').textContent}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
        pagebreak: { mode: ['css', 'legacy'], avoid: 'tr' }
      };

      html2pdf().set(opt).from(element).save();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
