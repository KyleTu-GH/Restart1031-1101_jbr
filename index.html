      { id: 12, team: "第2隊", name: "鄭雅各", transportOut: "遊覽車", leaderTransportOut: "", transportIn: "遊覽車", leaderTransportIn: "", restaurant: "植田割烹", leaderRestaurant: "", dietary: "葷食 (無特殊)", hotel: "正巧", roomType: "4人房", roomGroup: "B201", fullRoomGroup: "正巧-4人房-B201", roommates: "" },
      { id: 13, team: "第1隊", name: "彭偉峰", transportOut: "高鐵 0812車次", leaderTransportOut: "", transportIn: "自處", leaderTransportIn: "", restaurant: "麵五三屋", leaderRestaurant: "", dietary: "無", hotel: "無住宿安排", roomType: "無", roomGroup: "", fullRoomGroup: "", roommates: "無" },
      { id: 14, team: "第3隊", name: "林珊汝", transportOut: "遊覽車", leaderTransportOut: "", transportIn: "遊覽車", leaderTransportIn: "", restaurant: "植田割烹", leaderRestaurant: "", dietary: "無", hotel: "正巧", roomType: "4人房", roomGroup: "C303", fullRoomGroup: "正巧-4人房-C303", roommates: "家人" }
    ];

    // 嚴格鎖定指定之唯一資料來源 Google Sheet，不作任何外部變更
    const FIXED_GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1rtaD9Y4-1iv4rD68QNT64dv1x-o02rUc2kyosc26LVM/edit?usp=sharing";

    // 中文繁體筆畫排序器
    const strokeCollator = new Intl.Collator('zh-Hant-TW', { collation: 'stroke', numeric: true });

    // 隊別優先權 (白 -> 紅 -> 綠 -> 接班人)
    function getTeamPriority(teamName) {
      const s = String(teamName || '').trim();
      if (s.includes('白')) return 1;
      if (s.includes('紅')) return 2;
      if (s.includes('綠')) return 3;
      if (s.includes('接班人')) return 4;
      return 100; // 其他隊別
    }

    // 根據「隊別」取得總表專屬淡色背景樣式
    function getTeamBgClass(teamName) {
      const s = String(teamName || '').trim();
      if (s.includes('白')) return 'team-bg-white hover:brightness-95';
      if (s.includes('紅')) return 'team-bg-red hover:brightness-95';
      if (s.includes('綠')) return 'team-bg-green hover:brightness-95';
      if (s.includes('接班人')) return 'team-bg-successor hover:brightness-95';
      return 'team-bg-default hover:bg-slate-50';
    }

    // 交通優先權 (遊覽車 -> 開車 -> 自處)
    function getTransportPriority(transName) {
      const s = String(transName || '').trim();
      if (s.includes('遊覽車') || s.includes('大巴') || s.includes('巴')) return 1;
      if (s.includes('開車') || s.includes('自駕')) return 2;
      if (s.includes('自處') || s.includes('自行') || s.includes('無')) return 3;
      return 50; // 其他（如高鐵等車次）
    }

    // 根據「交通-回程」取得專屬淡色背景樣式
    function getTransportInboundMeta(transIn) {
      const s = String(transIn || '').trim();
      if (s.includes('遊覽車') || s.includes('大巴')) {
        return 'trans-in-bg-bus hover:brightness-95';
      }
      if (s.includes('開車') || s.includes('自駕')) {
        return 'trans-in-bg-car hover:brightness-95';
      }
      if (s.includes('高鐵')) {
        return 'trans-in-bg-hsr hover:brightness-95';
      }
      return 'trans-in-bg-self hover:brightness-95';
    }

    // 應用程式核心狀態
    let participants = [];
    let currentTab = 'overview'; // 'overview' | 'transport' | 'dining' | 'lodging'

    // 產生格式為 yy'mmdd-HHmm 的更新日時字串
    function getFormattedTimestamp() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const HH = String(now.getHours()).padStart(2, '0');
      const MM = String(now.getMinutes()).padStart(2, '0');
      return `${yy}'${mm}${dd}-${HH}${MM}`;
    }

    function updateTimestampDisplay() {
      const tsEl = document.getElementById('systemUpdateTimestamp');
      if (tsEl) {
        tsEl.innerText = getFormattedTimestamp();
      }
    }

    // 表頭欄位篩選與手動排序狀態
    const columnFilters = {};
    let activeSort = null;

    // 當前正在開啟篩選彈窗的欄位上下文
    let currentFilterContext = {
      columnKey: '',
      title: '',
      allValues: [],
      selectedValues: new Set()
    };

    function isLeader(val) {
      if (!val) return false;
      const s = String(val).trim();
      return /隊長|組長|是|true|Y|yes/i.test(s);
    }

    // 計算同房室友（彭偉峰排除；林政緯:家人、林珊汝:家人、杜志峰:無）
    function calculateRoommates(dataList) {
      const groupMap = {};

      dataList.forEach(item => {
        if (item.name === '彭偉峰') return;

        const groupKey = (item.fullRoomGroup && item.fullRoomGroup.trim()) 
          ? item.fullRoomGroup.trim() 
          : `${item.hotel || ''}__${item.roomType || ''}__${item.roomGroup || ''}`;

        if (groupKey && !groupKey.includes('無住宿') && groupKey !== '____' && groupKey !== '無') {
          if (!groupMap[groupKey]) groupMap[groupKey] = [];
          groupMap[groupKey].push(item.name);
        }
      });

      return dataList.map(item => {
        const nameTrimmed = (item.name || '').trim();

        // 規則特定指定
        if (nameTrimmed === '林政緯') return { ...item, roommates: '家人' };
        if (nameTrimmed === '林珊汝') return { ...item, roommates: '家人' };
        if (nameTrimmed === '杜志峰') return { ...item, roommates: '無' };
        if (nameTrimmed === '彭偉峰') return { ...item, roommates: '無' };

        if (item.roommates && item.roommates.trim() && item.roommates !== '無 (單人房)') {
          return item;
        }

        const groupKey = (item.fullRoomGroup && item.fullRoomGroup.trim()) 
          ? item.fullRoomGroup.trim() 
          : `${item.hotel || ''}__${item.roomType || ''}__${item.roomGroup || ''}`;

        const allInRoom = groupMap[groupKey] || [];
        const otherRoommates = allInRoom.filter(name => name !== item.name);

        return {
          ...item,
          roommates: otherRoommates.length > 0 ? otherRoommates.join('、') : '無'
        };
      });
    }

    function getCsvExportUrl(url) {
      const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) {
        // 加上時間戳記避免瀏覽器本機快取舊資料
        return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv&t=${Date.now()}`;
      }
      return url;
    }

    async function loadDataFromGoogleSheet() {
      // 永遠讀取您指定的試算表
      const csvUrl = getCsvExportUrl(FIXED_GOOGLE_SHEET_URL);
      const refreshIcon = document.getElementById('refreshIcon');

      refreshIcon.classList.add('fa-spin');

      try {
        const response = await fetch(csvUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error("無法讀取 Google Sheet CSV");
        const csvText = await response.text();
        const parsed = parseSheetCsv(csvText);

        if (parsed.length > 0) {
          participants = calculateRoommates(parsed);
          render();
        } else {
          throw new Error("試算表無名單資料");
        }
      } catch (err) {
        console.warn("載入指定 Google 試算表時受到權限或連線限制，使用預設快取資料：", err);
        if (!participants.length) {
          participants = calculateRoommates([...DEFAULT_SHEET_DATA]);
        }
        render();
      } finally {
        refreshIcon.classList.remove('fa-spin');
      }
    }

    function parseSheetCsv(csvText) {
      const results = Papa.parse(csvText.trim(), { skipEmptyLines: true });
      if (!results.data || results.data.length < 2) return [];

      const rows = results.data;
      const headers = rows[0].map(h => h.trim().replace(/\s+/g, ''));

      const findIndex = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));

      const idxTeam = findIndex(['隊別', '組別', '隊伍', 'Team']);
      const idxName = findIndex(['姓名', '名字', '人員', 'Name']);
      const idxTransOut = findIndex(['交通-去程', '去程', '出發交通', 'Outbound']);
      const idxTransIn = findIndex(['交通-回程', '回程', '返程交通', 'Inbound']);
      const idxRestaurant = findIndex(['餐廳', '用餐餐廳', '餐飲', 'Restaurant']);
      const idxDietary = findIndex(['飲食注意事項', '飲食', '素食', 'Diet']);
      const idxHotel = findIndex(['住宿飯店', '住宿', '飯店', 'Hotel']);
      const idxRoom = findIndex(['房型', '房間', 'Room']);

      const idxLdrTransOut = findIndex(['交通-去程_隊長', '去程隊長', '去程_隊長']);
      const idxLdrTransIn = findIndex(['交通-回程_隊長', '回程隊長', '回程_隊長']);
      const idxLdrRest = findIndex(['餐廳_隊長', '用餐_隊長', '餐廳隊長']);
      const idxLdrGeneral = findIndex(['隊長', '組長', 'Leader']);

      const idxRoomGroup = findIndex(['房間分組', '房號', '分組號']);
      const idxFullRoomGroup = findIndex(['住宿-房型-分組', '住宿房型分組', '房型分組']);
      const idxRoommates = findIndex(['室友', '同住者', '同房']);

      const parsedList = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (row.every(cell => !cell || !cell.trim())) continue;

        const generalLeader = (idxLdrGeneral !== -1 && row[idxLdrGeneral]) ? row[idxLdrGeneral].trim() : '';
        const nameVal = (idxName !== -1 && row[idxName]) ? row[idxName].trim() : (row[1] || '無姓名');

        parsedList.push({
          id: i,
          team: (idxTeam !== -1 && row[idxTeam]) ? row[idxTeam].trim() : (row[0] || '未分隊'),
          name: nameVal,
          transportOut: (idxTransOut !== -1 && row[idxTransOut]) ? row[idxTransOut].trim() : (row[2] || '自處'),
          transportIn: (idxTransIn !== -1 && row[idxTransIn]) ? row[idxTransIn].trim() : (row[3] || '自處'),
          leaderTransportOut: (idxLdrTransOut !== -1 && row[idxLdrTransOut]) ? row[idxLdrTransOut].trim() : generalLeader,
          leaderTransportIn: (idxLdrTransIn !== -1 && row[idxLdrTransIn]) ? row[idxLdrTransIn].trim() : generalLeader,
          restaurant: (idxRestaurant !== -1 && row[idxRestaurant]) ? row[idxRestaurant].trim() : (row[4] || '未指定'),
          leaderRestaurant: (idxLdrRest !== -1 && row[idxLdrRest]) ? row[idxLdrRest].trim() : generalLeader,
          dietary: (idxDietary !== -1 && row[idxDietary]) ? row[idxDietary].trim() : (row[5] || '無'),
          hotel: (idxHotel !== -1 && row[idxHotel]) ? row[idxHotel].trim() : (row[6] || '無住宿安排'),
          roomType: (idxRoom !== -1 && row[idxRoom]) ? row[idxRoom].trim() : (row[7] || '無'),
          roomGroup: (idxRoomGroup !== -1 && row[idxRoomGroup]) ? row[idxRoomGroup].trim() : '',
          fullRoomGroup: (idxFullRoomGroup !== -1 && row[idxFullRoomGroup]) ? row[idxFullRoomGroup].trim() : '',
          roommates: (idxRoommates !== -1 && row[idxRoommates]) ? row[idxRoommates].trim() : ''
        });
      }
      return parsedList;
    }

    // 取得資料行對應欄位純文字值
    function getColumnValue(item, key) {
      if (!item) return '';
      switch (key) {
        case 'name': return item.name || '';
        case 'team': return item.team || '';
        case 'transCombo': return `${item.transportOut || '自處'}/${item.transportIn || '自處'}`;
        case 'transportOut': {
          // 餐飲安排分頁時，「自處」替換為「遊覽車」
          const val = item.transportOut || '自處';
          if (currentTab === 'dining' && val === '自處') return '遊覽車';
          return val;
        }
        case 'transportIn': return item.transportIn || '自處';
        case 'restaurant': return item.restaurant || '';
        case 'dietary': return item.dietary || '無';
        case 'hotel': return item.hotel || '無住宿安排';
        case 'roomType': return item.roomType || '無';
        case 'hotelRoomCombo': return `${item.hotel || '無'}-${item.roomType || '無'}`;
        case 'roommates': return item.roommates || '無';
        default: return item[key] ? String(item[key]) : '';
      }
    }

    // 渲染室友膠囊標籤
    function renderRoommateChips(roommatesStr, isSmall = false) {
      const val = (roommatesStr || '').trim();
      if (!val || val === '無') {
        return `<span class="text-slate-400 bg-slate-100 px-2 py-0.5 rounded text-xs">無</span>`;
      }
      if (val === '家人') {
        return `<span class="inline-flex items-center gap-1 bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded font-medium ${isSmall ? 'text-xs' : 'text-sm'}"><i class="fa-solid fa-people-roof text-xs text-amber-600"></i>家人</span>`;
      }
      const names = val.split(/[、,，\s]+/).filter(Boolean);
      return `
        <div class="flex flex-wrap gap-1.5 items-center">
          ${names.map(n => `
            <span class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-800 border border-indigo-200 px-2.5 py-0.5 rounded font-bold shadow-2xs ${isSmall ? 'text-xs' : 'text-base text-indigo-900'}">
              <i class="fa-solid fa-user text-[11px] text-indigo-500"></i>
              ${n}
            </span>
          `).join('')}
        </div>
      `;
    }

    function getProcessedData() {
      const keyword = document.getElementById('globalSearchInput').value.trim().toLowerCase();
      let list = [...participants];

      // 住宿安排分頁：排除「彭偉峰」
      if (currentTab === 'lodging') {
        list = list.filter(item => item.name !== '彭偉峰');
      }

      // 餐飲安排分頁：移除用餐餐廳為「NO」的資料
      if (currentTab === 'dining') {
        list = list.filter(item => {
          const rest = (item.restaurant || '').trim();
          return rest && rest.toUpperCase() !== 'NO' && rest !== '無';
        });
      }

      // 1. 全文即時檢索過濾
      if (keyword) {
        list = list.filter(item => {
          const combined = [
            item.name,
            item.team,
            item.transportOut,
            item.transportIn,
            `${item.transportOut}/${item.transportIn}`,
            item.restaurant,
            item.dietary,
            item.hotel,
            item.roomType,
            `${item.hotel}-${item.roomType}`,
            item.roommates
          ].join(' ').toLowerCase();
          return combined.includes(keyword);
        });
      }

      // 2. 表頭特定值過濾 (Column Filters)
      const filterKeys = Object.keys(columnFilters);
      if (filterKeys.length > 0) {
        list = list.filter(item => {
          return filterKeys.every(colKey => {
            const selectedSet = columnFilters[colKey];
            if (!selectedSet || selectedSet.size === 0) return true;
            const val = getColumnValue(item, colKey);
            return selectedSet.has(val);
          });
        });
      }

      // 3. 排序邏輯
      if (activeSort) {
        const { columnKey, direction } = activeSort;
        const multiplier = direction === 'asc' ? 1 : -1;
        list.sort((a, b) => {
          const valA = getColumnValue(a, columnKey);
          const valB = getColumnValue(b, columnKey);
          return multiplier * strokeCollator.compare(valA, valB);
        });
      } else {
        if (currentTab === 'overview') {
          // 總表排序：1. 隊別 (白-紅-綠-接班人) -> 2. 用餐餐廳 -> 3. 住宿飯店-房型 -> 4. 室友
          list.sort((a, b) => {
            const pA = getTeamPriority(a.team);
            const pB = getTeamPriority(b.team);
            if (pA !== pB) return pA - pB;

            const cTeam = strokeCollator.compare(a.team || '', b.team || '');
            if (cTeam !== 0) return cTeam;

            const cRest = strokeCollator.compare(a.restaurant || '', b.restaurant || '');
            if (cRest !== 0) return cRest;

            const hrA = `${a.hotel || ''}-${a.roomType || ''}`;
            const hrB = `${b.hotel || ''}-${b.roomType || ''}`;
            const cHotelRoom = strokeCollator.compare(hrA, hrB);
            if (cHotelRoom !== 0) return cHotelRoom;

            return strokeCollator.compare(a.roommates || '', b.roommates || '');
          });
        } 
        else if (currentTab === 'transport') {
          // 交通安排排序：
          // 1. 「隊長」置於最上方
          // 2. 其餘：交通去程 (遊覽車-開車-自處) -> 交通回程 (遊覽車-開車-自處) -> 姓名 (筆畫)
          list.sort((a, b) => {
            const aIsLeader = isLeader(a.leaderTransportOut) || isLeader(a.leaderTransportIn);
            const bIsLeader = isLeader(b.leaderTransportOut) || isLeader(b.leaderTransportIn);
            if (aIsLeader && !bIsLeader) return -1;
            if (!aIsLeader && bIsLeader) return 1;

            const priOutA = getTransportPriority(a.transportOut);
            const priOutB = getTransportPriority(b.transportOut);
            if (priOutA !== priOutB) return priOutA - priOutB;

            const cOut = strokeCollator.compare(a.transportOut || '', b.transportOut || '');
            if (cOut !== 0) return cOut;

            const priInA = getTransportPriority(a.transportIn);
            const priInB = getTransportPriority(b.transportIn);
            if (priInA !== priInB) return priInA - priInB;

            const cIn = strokeCollator.compare(a.transportIn || '', b.transportIn || '');
            if (cIn !== 0) return cIn;

            return strokeCollator.compare(a.name || '', b.name || '');
          });
        } 
        else if (currentTab === 'dining') {
          // 餐飲安排排序：
          // 1. 各餐廳「隊長」置於最上方
          // 2. 其餘：1.用餐餐廳 -> 2.交通方式 (遊覽車-開車-自處) -> 3.姓名 (筆畫由少到多)
          list.sort((a, b) => {
            const cRest = strokeCollator.compare(a.restaurant || '', b.restaurant || '');
            if (cRest !== 0) return cRest;

            const aIsLdr = isLeader(a.leaderRestaurant) || isLeader(a.leaderTransportOut);
            const bIsLdr = isLeader(b.leaderRestaurant) || isLeader(b.leaderTransportOut);
            if (aIsLdr && !bIsLdr) return -1;
            if (!aIsLdr && bIsLdr) return 1;

            // 交通方式比對 (餐飲自處視為遊覽車)
            const tA = getColumnValue(a, 'transportOut');
            const tB = getColumnValue(b, 'transportOut');
            const priA = getTransportPriority(tA);
            const priB = getTransportPriority(tB);
            if (priA !== priB) return priA - priB;

            const cTrans = strokeCollator.compare(tA, tB);
            if (cTrans !== 0) return cTrans;

            return strokeCollator.compare(a.name || '', b.name || '');
          });
        } 
        else if (currentTab === 'lodging') {
          // 住宿安排：住宿飯店 - 房型 - 姓名 - 同房室友（字首筆畫數由少到多）
          list.sort((a, b) => {
            const cmpHotel = strokeCollator.compare(a.hotel || '', b.hotel || '');
            if (cmpHotel !== 0) return cmpHotel;

            const cmpRoom = strokeCollator.compare(a.roomType || '', b.roomType || '');
            if (cmpRoom !== 0) return cmpRoom;

            const cmpName = strokeCollator.compare(a.name || '', b.name || '');
            if (cmpName !== 0) return cmpName;

            return strokeCollator.compare(a.roommates || '', b.roommates || '');
          });
        }
      }

      return list;
    }

    // 餐廳圖標與專屬淡色背景分類
    function getRestaurantMeta(restaurantName) {
      const name = (restaurantName || '').trim();
      if (name.includes('麵五三')) {
        return {
          rowClass: 'rest-bg-0 hover:brightness-95',
          icon: 'fa-bowl-food',
          iconColor: 'text-amber-600'
        };
      }
      if (name.includes('植田')) {
        return {
          rowClass: 'rest-bg-1 hover:brightness-95',
          icon: 'fa-fish-fins',
          iconColor: 'text-emerald-600'
        };
      }
      if (name.includes('弎食')) {
        return {
          rowClass: 'rest-bg-2 hover:brightness-95',
          icon: 'fa-fire-burner',
          iconColor: 'text-blue-600'
        };
      }
      if (name.includes('湫禾')) {
        return {
          rowClass: 'rest-bg-3 hover:brightness-95',
          icon: 'fa-hot-tub-person',
          iconColor: 'text-purple-600'
        };
      }
      return {
        rowClass: 'rest-bg-other hover:bg-slate-50',
        icon: 'fa-utensils',
        iconColor: 'text-slate-600'
      };
    }

    // 住宿飯店專屬圖標與淡色背景
    function getHotelMeta(hotelName) {
      const name = (hotelName || '').trim();
      if (name.includes('正巧')) {
        return {
          rowClass: 'hotel-bg-0 hover:brightness-95',
          icon: 'fa-tree-city',
          iconColor: 'text-teal-600'
        };
      }
      if (name.includes('知達')) {
        return {
          rowClass: 'hotel-bg-1 hover:brightness-95',
          icon: 'fa-landmark',
          iconColor: 'text-amber-600'
        };
      }
      return {
        rowClass: 'hotel-bg-other hover:bg-slate-50',
        icon: 'fa-hotel',
        iconColor: 'text-sky-600'
      };
    }

    // 飲食注意事項 Badge：為「無」時以淺灰顯示
    function renderDietaryBadge(diet) {
      const val = (diet || '').trim();
      if (!val || val === '無' || val.includes('無特殊')) {

    window.openColumnFilter = function(e, colKey, colTitle) {
      e.stopPropagation();
      const popover = document.getElementById('columnFilterPopover');
      const backdrop = document.getElementById('filterBackdrop');
      const rect = e.currentTarget.getBoundingClientRect();

      backdrop.classList.remove('hidden');
      popover.classList.remove('hidden');

      // 重置拖曳位移
      popover.style.transform = '';

      if (window.innerWidth <= 640) {
        // 手機版：置中顯示
        popover.style.left = '50%';
        popover.style.top = '50%';
        popover.style.transform = 'translate(-50%, -50%)';
      } else {
        // 桌機版：邊界智慧判定
        const popoverWidth = 320;
        const popoverHeight = 360;

        let left = rect.left;
        let top = rect.bottom + 8;

        if (left + popoverWidth > window.innerWidth - 16) {
          left = window.innerWidth - popoverWidth - 16;
        }
        if (left < 16) left = 16;

        if (top + popoverHeight > window.innerHeight - 16) {
          top = Math.max(16, rect.top - popoverHeight - 8);
        }

        popover.style.left = `${left}px`;
        popover.style.top = `${top}px`;
      }

      // 收集該欄位所有不重複選項
      let allItems = participants.filter(it => currentTab !== 'lodging' || it.name !== '彭偉峰');
      if (currentTab === 'dining') {
        allItems = allItems.filter(it => (it.restaurant || '').trim().toUpperCase() !== 'NO');
      }

      const uniqueVals = Array.from(new Set(allItems.map(it => getColumnValue(it, colKey)))).filter(Boolean);
      uniqueVals.sort((a, b) => strokeCollator.compare(a, b));

      const activeSet = columnFilters[colKey] ? new Set(columnFilters[colKey]) : new Set(uniqueVals);

      currentFilterContext = {
        columnKey: colKey,
        title: colTitle,
        allValues: uniqueVals,
        selectedValues: activeSet
      };

      document.getElementById('filterColTitle').innerText = `${colTitle} 篩選`;
      document.getElementById('filterSearchInput').value = '';
      renderFilterOptions();
    };

    (function initDraggableFilterModal() {
      const popover = document.getElementById('columnFilterPopover');
      const handle = document.getElementById('filterDragHandle');
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;

      function onStart(e) {
        if (e.target.closest('button')) return;
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const rect = popover.getBoundingClientRect();
        popover.style.transform = 'none';
        popover.style.left = `${rect.left}px`;
        popover.style.top = `${rect.top}px`;

        startX = clientX;
        startY = clientY;
        initialLeft = rect.left;
        initialTop = rect.top;

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      }

      function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        let newLeft = initialLeft + deltaX;
        let newTop = initialTop + deltaY;

        const maxLeft = window.innerWidth - popover.offsetWidth - 10;
        const maxTop = window.innerHeight - popover.offsetHeight - 10;
        newLeft = Math.max(10, Math.min(newLeft, maxLeft));
        newTop = Math.max(10, Math.min(newTop, maxTop));

        popover.style.left = `${newLeft}px`;
        popover.style.top = `${newTop}px`;
      }

      function onEnd() {
        isDragging = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      }

      handle.addEventListener('mousedown', onStart);
      handle.addEventListener('touchstart', onStart, { passive: true });
    })();

    function renderFilterOptions() {
      const listEl = document.getElementById('filterOptionsList');
      const filterKeyword = document.getElementById('filterSearchInput').value.trim().toLowerCase();

      const filtered = currentFilterContext.allValues.filter(val => {
        return !filterKeyword || String(val).toLowerCase().includes(filterKeyword);
      });

      listEl.innerHTML = filtered.map(val => {
        const checked = currentFilterContext.selectedValues.has(val) ? 'checked' : '';
        return `
          <label class="flex items-center gap-2 py-1 px-1 rounded hover:bg-slate-50 cursor-pointer text-slate-700">
            <input type="checkbox" value="${encodeURIComponent(val)}" class="filter-chk rounded text-brand-600 focus:ring-brand-500" ${checked}>
            <span class="truncate">${val}</span>
          </label>
        `;
      }).join('');

      listEl.querySelectorAll('.filter-chk').forEach(chk => {
        chk.addEventListener('change', (ev) => {
          const val = decodeURIComponent(ev.target.value);
          if (ev.target.checked) currentFilterContext.selectedValues.add(val);
          else currentFilterContext.selectedValues.delete(val);
        });
      });
    }

        delete columnFilters[colKey];
      } else {
        columnFilters[colKey] = new Set(currentFilterContext.selectedValues);

    function executePdfExport() {
      const exportElement = document.getElementById('pdfExportContainer');
      const pdfHeader = document.getElementById('pdfHeaderBanner');
      const docTitle = document.getElementById('pdfDocumentTitle');
      const dateEl = document.getElementById('pdfExportDate');

      const tabTitleMap = {
        overview: '活動行程名冊 - 總表',
        transport: '活動行程名冊 - 交通安排',
        dining: '活動行程名冊 - 餐飲安排',
        lodging: '活動行程名冊 - 住宿安排'
      };

      const title = tabTitleMap[currentTab] || '活動名冊';
      docTitle.innerText = title;
      dateEl.innerText = new Date().toLocaleDateString('zh-TW');

      pdfHeader.classList.remove('hidden');

      // 啟用專屬 PDF 渲染防斷裂模式
      exportElement.classList.add('pdf-render-mode');

      // html2pdf 設定：加入多層級避切（avoid-all）規則
      const opt = {
        margin: [10, 8, 10, 8],
        filename: `${title}_${new Date().toISOString().slice(0, 10)}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
          scale: 2, 
          useCORS: true, 
          logging: false,
          scrollY: 0
        },
        jsPDF: { 
          unit: 'mm', 
          format: 'a4', 
          orientation: currentTab === 'overview' ? 'landscape' : 'portrait' 
        },
        pagebreak: { 
          mode: ['avoid-all', 'css', 'legacy'],
          avoid: ['tr', 'thead', 'h2', 'p'] 
        }
      };

      const btn = document.getElementById('exportPdfBtn');
      const originHtml = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 匯出中...`;
      btn.disabled = true;

      html2pdf().set(opt).from(exportElement).save().then(() => {
        pdfHeader.classList.add('hidden');
        exportElement.classList.remove('pdf-render-mode');
        btn.innerHTML = originHtml;
        btn.disabled = false;
      }).catch(err => {
        console.error("PDF 產生失敗：", err);
        pdfHeader.classList.add('hidden');
        exportElement.classList.remove('pdf-render-mode');
        btn.innerHTML = originHtml;
        btn.disabled = false;
        window.print();
      });
    }

    // 系統初始化啟動
    window.addEventListener('DOMContentLoaded', () => {
      updateTimestampDisplay();
      participants = calculateRoommates([...DEFAULT_SHEET_DATA]);
      render();
      // 初始化時立即自動連線您指定的 Google 試算表
      loadDataFromGoogleSheet();
    });
  </script>
</body>
</html>
