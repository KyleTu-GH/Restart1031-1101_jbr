<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重啟人生-翻轉實驗室 10/31-11/01</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @media print {
      body { background-color: #fff !important; }
      .no-print { display: none !important; }
      thead { display: table-header-group !important; }
      tr { break-inside: avoid !important; page-break-inside: avoid !important; }
      .table-container { max-height: none !important; overflow: visible !important; border: none !important; }
    }

    .table-container {
      max-height: calc(100vh - 270px);
      overflow-y: auto;
      overflow-x: auto;
      position: relative;
    }

    /* 表頭固定且實心背景，徹底解決向下滾動時文字重疊穿透問題 */
    .sticky-header th {
      position: sticky !important;
      top: 0 !important;
      z-index: 25 !important;
      background-color: #f1f5f9 !important;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    
    /* 總表隊別底色 */
    .bg-team-white { background-color: #f1f5f9; }
    .bg-team-red { background-color: #ffe4e6; }
    .bg-team-green { background-color: #ecfdf5; }
    .bg-team-successor { background-color: #fef9c3; }

    /* 活動流程階層項目符號樣式 */
    .bullet-level-1 {
      position: relative;
      padding-left: 1.1rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-1::before {
      content: "•";
      position: absolute;
      left: 0.2rem;
      top: -0.05rem;
      font-weight: bold;
      color: #64748b;
    }

    .bullet-level-2 {
      position: relative;
      padding-left: 1.85rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-2::before {
      content: "◦";
      position: absolute;
      left: 0.95rem;
      top: -0.05rem;
      font-weight: bold;
      color: #94a3b8;
    }

    .bullet-level-3 {
      position: relative;
      padding-left: 2.6rem;
      margin-bottom: 0.25rem;
    }
    .bullet-level-3::before {
      content: "▪";
      position: absolute;
      left: 1.75rem;
      top: 0rem;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    /* 需行政支援醒目卡片 */
    .admin-support-item {
      background: linear-gradient(90deg, #f5f3ff 0%, #faf5ff 100%);
      border-left: 3px solid #8b5cf6;
      border-radius: 4px;
      padding: 3px 8px;
      margin-top: 3px;
      margin-bottom: 3px;
      color: #5b21b6;
      font-weight: 500;
    }

    /* 篩選彈窗 */
    #filterDropdownModal {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

          <i class="fa-solid fa-compass text-lg"></i>
        </div>
